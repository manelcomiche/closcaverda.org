allowBuilds:
  sharp: true
  unrs-resolver: true

# Every published minimatch below 11.0.1 has GHSA-g3hv-75wg-m249 (moderate, dev-only: ESLint).
# Only the 10.x line is lifted: its consumers (eslint, @eslint/config-array, typescript-estree)
# use the named exports, which 11.x keeps. The 3.x consumers (eslint-plugin-import, -jsx-a11y,
# -react) call the default export that 11.x removed, so they stay on 3.x for now.
overrides:
  minimatch@10: ^11.0.1

# Supply-chain cooldown: refuse versions published less than 24h ago
# (pnpm >= 10.16; pnpm 11 defaults to this). Renovate adds a 7-day cooldown on top.
minimumReleaseAge: 1440
